<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redline walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
/* ===================== FILM LOOK ===================== */
:root {
  --bg: #222222;            /* behind the app window: dark gray, never pure black */
  --frame: #2d2d2d;         /* window border: match the product's own divider color */
  --ink: #FF4B3A;           /* redline ink */
  --note-size: 46px;        /* handwritten notes, about 2.5% of stage width */
  --ink-width: 6px;         /* stroke in world units */
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#viewport { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; overflow: hidden; background: var(--bg); flex: none; transform-origin: 50% 50%; font-family: var(--ui-font); -webkit-font-smoothing: antialiased; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 24px; box-shadow: 0 0 0 1px var(--frame), 0 40px 120px rgba(0,0,0,.55); }
#world > * { position: absolute; box-sizing: border-box; margin: 0; }
#ink { left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 30; }
#ink path { fill: none; stroke: var(--ink); stroke-width: var(--ink-width); stroke-linecap: round; stroke-linejoin: round; }
#notes { left: 0; top: 0; width: 0; height: 0; z-index: 31; }
.note { position: absolute; white-space: nowrap; font-family: "Caveat", "Segoe Print", cursive; font-weight: 600; font-size: var(--note-size); line-height: 1.1; color: var(--ink); }
#cursor { left: 0; top: 0; z-index: 32; opacity: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

/* ===================== PRODUCT UI (replace) ===================== */
/* Demo: a generic dark app. Positions are world pixels, measured from the screenshots. */
#world { background: #000000; }
.side { left: 0; top: 0; width: 220px; height: 1000px; background: #0c0c0c; border-right: 1px solid #2d2d2d; }
.side i { position: absolute; left: 40px; width: 140px; height: 14px; border-radius: 7px; background: #262626; }
.panel { border: 2px solid #303030; }
.strip { left: 262px; width: 1296px; height: 64px; background: #121212; border-radius: 14px 14px 0 0; }
.canvas { left: 268px; width: 1284px; background: #181818; border-radius: 14px; }
.app-icon { left: 0; top: 0; width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #ff7a45, #e8384f); transform-origin: 0 0; }
.title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 24px; line-height: 30px; font-weight: 600; color: #f5f5f5; }
.btn { display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #2a2a2a; border-radius: 8px; color: #f5f5f5; font-size: 18px; font-weight: 600; white-space: nowrap; }
.btn.primary { background: #3b6cff; border-color: transparent; }
.btn.icon { background: #1e1e1e; border-color: transparent; border-radius: 50%; }
.doc { left: 0; top: 0; width: 0; height: 0; }
.doc b { position: absolute; border-radius: 10px; background: #262626; }

/* ===================== STILL-FRAME HELPERS ===================== */
body.export #viewport { display: block; }
body.export #stage { transform: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="world">

  <!-- ===================== PRODUCT UI MARKUP (replace) ===================== -->
  <div class="side"><i style="top:40px"></i><i style="top:100px;width:110px"></i><i style="top:140px;width:120px"></i><i style="top:180px;width:90px"></i></div>
  <div class="panel" id="panel"></div>
  <div class="strip" id="strip"></div>
  <div class="canvas" id="canvas"></div>
  <div class="doc" id="doc">
    <b style="left:420px;top:300px;width:980px;height:56px"></b>
    <b style="left:420px;top:390px;width:470px;height:300px"></b>
    <b style="left:930px;top:390px;width:470px;height:300px"></b>
    <b style="left:420px;top:730px;width:980px;height:160px"></b>
  </div>
  <div class="app-icon" id="appIcon"></div>
  <div class="title" id="title">Quarterly Planning Deck</div>
  <div class="btn" id="btnShare">Share</div>
  <div class="btn icon" id="btnDl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5f5f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></div>
  <div class="btn primary" id="btnPrimary"><span id="primaryLabel">Export</span></div>

  <!-- ===================== ENGINE LAYERS (keep) ===================== -->
  <svg id="ink"></svg>
  <div id="notes"></div>
  <div id="cursor"><svg width="30" height="40" viewBox="0 0 17 22"><path d="M1.5 1.5 L1.5 17 L5.3 13.5 L8 19.6 L10.8 18.4 L8.2 12.5 L13.2 12.5 Z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
</div></div></div>

<script>
/* ===================== CONFIG (edit) ===================== */
const CONFIG = {
  stage: { w: 1800, h: 1200 },            // output video size
  world: { w: 1600, h: 1000 },            // screenshot size, in its native pixels
  background: '#222222',                   // keep in sync with --bg
  camera: {
    context: { fit: 0.9 },                 // whole window at 90% of stage width
    focus: { x: 240, y: 20, w: 1340, h: 960, margin: 40 },  // the panel being redesigned
    breathe: 0.004,                        // +/- scale drift over 12s
  },
  speed: 1,                                // 1.25 = 25% faster
};

/* ===================== HELPERS ===================== */
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const px = v => v.toFixed(2) + 'px';
const mix = (a, b, p) => 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',') + ')';
const $ = s => document.querySelector(s);
function box(el, x, y, w, h) { const s = el.style; s.left = px(x); s.top = px(y); s.width = px(w); s.height = px(h); }

/* ===================== PRODUCT UI RENDER (replace) =====================
   P holds progress values 0..1, one per improvement. Every visual property is a
   function of P (and T for ambient motion). No transitions, no timers. */
const UI = { panel: $('#panel'), strip: $('#strip'), canvas: $('#canvas'), doc: $('#doc'), icon: $('#appIcon'),
  title: $('#title'), share: $('#btnShare'), dl: $('#btnDl'), primary: $('#btnPrimary'), label: $('#primaryLabel'), word: '' };

function renderUI(P, T) {
  const e1 = eio(P.k1 || 0), k2 = P.k2 || 0, e2 = eio(k2), d2 = eo(P.k2b || 0);
  // 1. Title moves into the panel: the panel grows upward to wrap it.
  box(UI.panel, 260, lerp(84, 20, e1), 1300, lerp(896, 960, e1));
  UI.panel.style.borderRadius = px(lerp(16, 22, e1));
  UI.panel.style.background = mix([0, 0, 0], [18, 18, 18], e1);
  UI.panel.style.borderColor = `rgba(48,48,48,${(1 - e1).toFixed(3)})`;
  const rowY = lerp(100, 112, e1);
  UI.strip.style.top = px(rowY - 14);
  UI.strip.style.opacity = 1 - seg(P.k1 || 0, .55, 1);
  const ctop = lerp(166, 176, e1);
  box(UI.canvas, 268, ctop, 1284, 972 - ctop);
  UI.canvas.style.opacity = e1;
  UI.icon.style.transform = `translate(${px(lerp(262, 290, e1))},${px(lerp(29, 51, e1))}) scale(${lerp(.85, 1.15, e1).toFixed(4)})`;
  UI.title.style.left = px(lerp(296, 336, e1));
  UI.title.style.top = px(lerp(27, 50, e1));
  // 2. Export becomes Publish; export moves to a download icon.
  box(UI.share, 282, rowY, 96, 36);
  box(UI.primary, lerp(1442, 1416, e2), rowY, lerp(96, 122, e2), 36);
  UI.primary.style.borderRadius = px(lerp(8, 18, e2));
  const word = k2 < .5 ? 'Export' : 'Publish';
  if (word !== UI.word) { UI.label.textContent = word; UI.word = word; }
  UI.label.style.opacity = k2 > 0 && k2 < 1 ? Math.abs(k2 - .5) * 2 : 1;
  box(UI.dl, 1368, rowY, 36, 36);
  UI.dl.style.opacity = d2;
  UI.dl.style.transform = `scale(${lerp(.9, 1, d2).toFixed(4)})`;
  UI.doc.style.transform = `translateY(${px(lerp(0, 10, e1))})`;
}

/* ===================== BEATS (edit) =====================
   Each beat: id, dur (seconds at speed 1),
     set:   progress values this beat completes (later beats inherit them)
     pose(t, P): set in-progress values for local time t; P.c is the camera (0 context, 1 focus)
     marks: ink shapes { k:'ell'|'line'|'arrow', ..., t0, dur, out, seed }
            ell:   x, y, w, h, [sq<1 = boxier], [tilt], [turn], [a0]
            line:  from:[x,y], to:[x,y], [bow]
            arrow: from, to, [bow], [head]
     notes: { x, y, text, t0, out }   (world coordinates; y is the top of the text) */
const BEATS = [
  { id: 'context', dur: 1.4, pose: (t, P) => { P.c = seg(t, .45, 1.1); } },
  { id: 'title', dur: 2.0, set: { k1: 1 },
    pose: (t, P) => { P.k1 = seg(t, 1.0, 1.4); },
    marks: [
      { k: 'ell', x: 250, y: 12, w: 360, h: 62, t0: .12, dur: .2, out: .92, seed: 3 },
      { k: 'arrow', from: [420, 74], to: [430, 118], bow: .12, head: 18, t0: .34, dur: .14, out: .92, seed: 5 },
    ],
    notes: [{ x: 700, y: 14, text: 'pull the title into the panel', t0: .46, out: 1.72 }] },
  { id: 'publish', dur: 2.6, set: { k2: 1, k2b: 1 },
    pose: (t, P) => { P.k2 = seg(t, 1.04, 1.32); P.k2b = seg(t, 1.28, 1.44); },
    marks: [
      { k: 'line', from: [1436, 136], to: [1546, 124], bow: .02, t0: .12, dur: .12, out: .96, seed: 11 },
      { k: 'ell', x: 1424, y: 98, w: 140, h: 64, t0: .24, dur: .18, out: .96, seed: 13 },
      { k: 'arrow', from: [1280, 250], to: [1360, 160], bow: -.12, head: 18, t0: 1.5, dur: .14, out: 2.16, seed: 17 },
    ],
    notes: [
      { x: 1020, y: 196, text: 'publish, not export', t0: .4, out: 1.2 },
      { x: 1020, y: 246, text: 'sharing in-app is the main path', t0: .56, out: 1.2 },
      { x: 960, y: 250, text: 'export moved here', t0: 1.6, out: 2.16 },
    ] },
  { id: 'after', dur: 3.2, pose: (t, P) => { P.c = 1 - seg(t, .3, 1.3); } },
];

/* ===================== ENGINE (keep) ===================== */
const NS = 'http://www.w3.org/2000/svg';
const W = CONFIG.world, S = CONFIG.stage;
const world = $('#world'), stage = $('#stage'), ink = $('#ink'), notesEl = $('#notes'), cursorEl = $('#cursor');
stage.style.width = S.w + 'px'; stage.style.height = S.h + 'px';
world.style.width = W.w + 'px'; world.style.height = W.h + 'px';
ink.setAttribute('viewBox', `0 0 ${W.w} ${W.h}`); ink.style.width = W.w + 'px'; ink.style.height = W.h + 'px';

function camera(c, T) {
  const cam = CONFIG.camera, f = cam.focus;
  const zc = S.w * cam.context.fit / W.w;
  const zf = Math.min((S.w - 2 * f.margin) / f.w, (S.h - 2 * f.margin) / f.h);
  const e = eio(cl(c)), br = 1 + cam.breathe * Math.sin(T * 2 * Math.PI / 12);
  const z = Math.exp(lerp(Math.log(zc), Math.log(zf), e)) * br;
  const cx = lerp(W.w / 2, f.x + f.w / 2, e), cy = lerp(W.h / 2, f.y + f.h / 2, e);
  world.style.transform = `translate(${px(S.w / 2 - cx * z)},${px(S.h / 2 - cy * z)}) scale(${z.toFixed(5)})`;
}

function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const se = (v, e) => (v < 0 ? -1 : 1) * Math.pow(Math.abs(v), e);
function shape(a, r) {
  if (a.k === 'ell') {
    const n = 34, pts = [], a0 = a.a0 ?? -2.5, turn = a.turn || 1.1, tl = a.tilt ?? -0.03, sq = a.sq || 1;
    for (let i = 0; i <= n; i++) {
      const th = a0 + turn * 2 * Math.PI * i / n, wob = 1 + (r() - .5) * .03 + .05 * i / n;
      const x = se(Math.cos(th), sq) * a.w / 2 * wob, y = se(Math.sin(th), sq) * a.h / 2 * wob;
      pts.push([a.x + a.w / 2 + x * Math.cos(tl) - y * Math.sin(tl), a.y + a.h / 2 + x * Math.sin(tl) + y * Math.cos(tl)]);
    }
    return [pts];
  }
  const [x0, y0] = a.from, [x1, y1] = a.to, dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, m = 12, ln = [];
  for (let j = 0; j <= m; j++) { const s = j / m, b = Math.sin(Math.PI * s) * (a.bow || 0) * L + (r() - .5) * 2; ln.push([x0 + dx * s + nx * b, y0 + dy * s + ny * b]); }
  const out = [ln];
  if (a.k === 'arrow') {
    const p1 = ln[m], p0 = ln[m - 2], ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), hl = a.head || 22;
    for (const sg of [1, -1]) {
      const aa = ang + Math.PI + sg * .5;
      out.push([[p1[0] + Math.cos(aa) * hl, p1[1] + Math.sin(aa) * hl], [p1[0] + Math.cos(aa) * hl * .5 + (r() - .5) * 1.5, p1[1] + Math.sin(aa) * hl * .5], [p1[0], p1[1]]]);
    }
  }
  return out;
}
function dpath(p) {
  const f = v => v.toFixed(1); let d = `M${f(p[0][0])} ${f(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += ` C${f(b[0] + (c[0] - a[0]) / 6)} ${f(b[1] + (c[1] - a[1]) / 6)} ${f(c[0] - (e[0] - b[0]) / 6)} ${f(c[1] - (e[1] - b[1]) / 6)} ${f(c[0])} ${f(c[1])}`;
  }
  return d;
}
const plen = p => p.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - p[i][0], q[1] - p[i][1]), 0);

function buildAnn(beat, bi) {
  const h = { marks: [], notes: [] };
  (beat.marks || []).forEach((a, ai) => {
    const r = rng((a.seed || 7) + ai * 31 + bi * 997), g = document.createElementNS(NS, 'g'), mk = { a, g, st: [] };
    let tot = 0;
    shape(a, r).forEach(pts => {
      const vs = [];
      for (let v = 0; v < 3; v++) {
        const rv = rng((a.seed || 7) * 7 + v * 101 + ai), jp = pts.map(p => [p[0] + (rv() - .5) * 3, p[1] + (rv() - .5) * 3]);
        const el = document.createElementNS(NS, 'path'), L = plen(jp) * 1.12 + 12;
        el.setAttribute('d', dpath(jp)); el.style.strokeDasharray = `${L} ${L}`; g.appendChild(el); vs.push({ el, L });
      }
      const len = plen(pts); mk.st.push({ vs, len }); tot += len;
    });
    let acc = 0; mk.st.forEach(s => { s.a = acc / tot; acc += s.len; s.b = acc / tot; });
    g.style.opacity = 0; ink.appendChild(g); h.marks.push(mk);
  });
  (beat.notes || []).forEach(n => {
    const el = document.createElement('div'); el.className = 'note'; el.textContent = n.text;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.opacity = 0;
    notesEl.appendChild(el); h.notes.push({ n, el });
  });
  return h;
}
function renderAnn(h, t, T, active) {
  const v = Math.floor(T * 12) % 3;
  h.marks.forEach(mk => {
    const a = mk.a, p = eo(seg(t, a.t0, a.t0 + (a.dur || .2))), o = active ? 1 - seg(t, a.out, a.out + .14) : 0;
    mk.g.style.opacity = p > 0 ? o : 0;
    mk.st.forEach(s => { const q = seg(p, s.a, s.b); s.vs.forEach((vv, i) => { vv.el.style.display = i === v ? '' : 'none'; vv.el.style.strokeDashoffset = (vv.L * (1 - q)).toFixed(1); }); });
  });
  h.notes.forEach(({ n, el }) => {
    const p = seg(t, n.t0, n.t0 + .1 + n.text.length * .008), o = active ? 1 - seg(t, n.out, n.out + .14) : 0;
    el.style.opacity = p > 0 ? o : 0;
    const ep = eo(p);
    el.style.clipPath = `inset(-16px calc(${((1 - ep) * 100).toFixed(2)}% - ${(16 * ep).toFixed(1)}px) -16px -16px)`;
  });
}

let start = 0;
const timeline = BEATS.map((b, i) => { const s = start; start += b.dur; return { b, s, h: buildAnn(b, i) }; });
const BASE = start;
window.FILM = { duration: BASE / CONFIG.speed, width: S.w, height: S.h, background: CONFIG.background };

window.renderAt = function (sec) {
  const T = Math.max(0, Math.min(sec * CONFIG.speed, BASE - 1e-6));
  let idx = timeline.findIndex(x => T < x.s + x.b.dur); if (idx < 0) idx = timeline.length - 1;
  const P = { c: 1 };
  for (let i = 0; i < idx; i++) Object.assign(P, timeline[i].b.set || {});
  const cur = timeline[idx], lt = T - cur.s;
  if (cur.b.pose) cur.b.pose(lt, P);
  renderUI(P, T);
  camera(P.c, T);
  const cu = P.cur || { o: 0 };
  cursorEl.style.opacity = cu.o || 0;
  if (cu.o) cursorEl.style.transform = `translate(${px(cu.x - 3)},${px(cu.y - 3)})`;
  timeline.forEach((x, i) => renderAnn(x.h, i === idx ? lt : -1, T, i === idx));
};

/* Preview: fit to window, autoplay and loop. Space pauses, arrow keys seek. ?export=1 renders on demand only. */
const exporting = new URLSearchParams(location.search).has('export');
if (exporting) { document.body.classList.add('export'); window.renderAt(0); }
else {
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / S.w, innerHeight / S.h)})`; };
  addEventListener('resize', fit); fit();
  let t0 = performance.now(), paused = false, held = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - held * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { held = Math.max(0, held + (e.code === 'ArrowRight' ? 1 : -1)); t0 = performance.now() - held * 1000; window.renderAt(held); }
  });
  document.fonts.ready.then(() => {
    const loop = now => { if (!paused) { held = ((now - t0) / 1000) % window.FILM.duration; window.renderAt(held); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
